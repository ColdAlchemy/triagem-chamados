name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Testes
        run: python -m unittest
      - name: Dados gravados iguais ao gerador
        run: python -m triagem dados --saida /tmp/chamados.jsonl && diff /tmp/chamados.jsonl data/chamados.jsonl
